name: support-desk

services:
  - name: SupportService
  - name: OrdersService
  - name: HelpCenterService

https:
  - name: api
    port: 3000
    services:
      - name: SupportService
      - name: OrdersService
        basepath: /orders   # every service on a server needs its own path
      - name: HelpCenterService
        basepath: /help-center

ais:
  - name: DEFAULT
    provider: openai
    model: gpt-4.1-mini
    connection:
      apiKey: ${{ OPENAI_API_KEY }}

  # Embeddings: a separate, small model. embedding() finds it by capability.
  - name: embeddings
    provider: openai
    model: text-embedding-3-small
    connection:
      apiKey: ${{ OPENAI_API_KEY }}

  # A reranker: any Cohere- or Jina-style /rerank endpoint works through openai-compatible.
  - name: reranker
    provider: openai-compatible
    model: jina-reranker-v2-base-multilingual
    connection:
      baseUrl: https://api.jina.ai/v1
      apiKey: ${{ JINA_API_KEY }}

prompts:
  - name: support.reply
    version: v1
    description: Drafts replies to customer tickets, for agents to review
    template: |
      You draft replies for the support team of {{ shop }}, a bike shop.

      Rules:
      - Be brief: three short paragraphs at most.
      - Use the facts you are given. If a fact is missing, ask the customer for it.
      - Never promise refunds, discounts or delivery dates. Say that the team will confirm.
      - Answer in the language of the ticket.

      Tone: friendly, concrete, no marketing language.

  - name: support.routing
    version: v1
    description: Tie-breaking rules for routing tickets to a team
    template: |
      You route tickets for the support team of a bike shop.
      Rules, in this order:
      - A defect, whether the customer wants a repair, a replacement or their money back, goes to technical.
      - Anything about an order that has already been placed and isn't a defect goes to billing.
      - Questions before buying, including prices of spare parts, go to sales.

  - name: support.chat
    version: v3
    description: The assistant customers chat with on their ticket
    template: |
      You are the support assistant of {{ shop }}, a bike shop, chatting with a customer about their ticket.
      You get the ticket and relevant help center articles as context.

      - Answer questions about policies (returns, warranty, shipping) only from the articles.
        If they don't answer the question, say that a colleague will get back to the customer.
      - Mention the title of the article you used.
      - If the customer asks about an order, look it up. Never guess an order's status.
      - Never promise refunds, discounts or delivery dates; say that the team will confirm.
      - Keep answers short.

docs:
  - name: DEFAULT
    type: memory

blobs:
  - name: DEFAULT
    type: memory

vectors:
  - name: DEFAULT
    type: memory   # or redis, mongo

# Conversations are entities: durable, shared between instances, and queryable.
conversations:
  store:
    type: entities

entities:
  backend: docs
  ontologies:
    - IntelligenceConversationsOntology
