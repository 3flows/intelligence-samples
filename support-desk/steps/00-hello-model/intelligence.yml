name: support-desk

services:
  - name: SupportService

https:
  - name: api
    port: 3000
    services:
      - name: SupportService

# One model. Swap provider and model to try another one, e.g. provider: ollama, model: llama3.1.
ais:
  - name: DEFAULT
    provider: openai
    model: gpt-4.1-mini
    connection:
      apiKey: ${{ OPENAI_API_KEY }}
