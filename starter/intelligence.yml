name: my-intelligence-app

intelligence:
  inference:
    require:
      metadata: false
      timeout: false
    onViolation: warn

https:
  - name: api
    port: 3000
    services:
      - name: SupportService

services:
  - name: SupportService

docs:
  - name: DEFAULT
    type: memory
  - name: agent-workspace
    type: memory

blobs:
  - name: DEFAULT
    type: memory
  - name: agent-artifacts
    type: memory

entities:
  backend: docs
  domains:
    - IntelligenceTrace
    - IntelligenceChatbot
    - IntelligenceAgent

ais:
  - name: DEFAULT
    provider: openai
    model: gpt-4.1-mini
    connection:
      apiKey: ${{ OPENAI_API_KEY }}

prompts:
  - name: support.chatbot.base
    version: v1
    template: |
      You are the starter app support chatbot.
      Keep answers short and use tools when they help.

skills:
  - name: starter_support
    description: Answer starter support questions and look up sample orders.
    instructions:
      - Prefer verified order data over guesses.
    tools:
      - service: SupportService
        tags: [public]

chatbots:
  - name: support
    type: conversation
    model: DEFAULT
    prompts:
      - name: support.chatbot.base
        version: v1
    history:
      maxMessages: 20
    http:
      path: /support
    tools:
      - service: SupportService
        tags: [public]
    toolPolicy:
      allowDestructive: false

agents:
  - name: starter_agent
    model: DEFAULT
    displayName: Starter Agent
    description: A small task-oriented agent for the starter app.
    instructions:
      - Work step by step and call tools when useful.
    skills:
      - starter_support
    tools:
      - service: SupportService
        tags: [public]
    policy:
      allowDestructive: false
      maxToolRounds: 3
    workspace:
      docs: agent-workspace
      blobs: agent-artifacts
      namespace: starter/agent
      tools: true
    http:
      path: /agents/starter
      useHttp: api
