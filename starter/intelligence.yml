name: my-intelligence-app

# Optional guardrails. Start with warnings while learning; tighten this in production.
intelligence:
  inference:
    require:
      metadata: false
      timeout: false
    onViolation: warn

# Platform exposure. The service handlers are the application API.
https:
  - name: api
    port: 3000
    services:
      - name: SupportService

services:
  - name: SupportService

# Platform storage used by Intelligence trace/chatbot/agent domains and the agent workspace.
docs:
  - name: DEFAULT
    type: memory
  - name: agent-workspace
    type: memory

blobs:
  - name: DEFAULT
    type: memory
  - name: agent-artifacts
    type: memory

entities:
  backend: docs
  domains:
    - IntelligenceTrace
    - IntelligenceChatbot
    - IntelligenceAgent

# 1. AIs: provider/model/capability configuration. No business logic here.
ais:
  - name: DEFAULT
    provider: openai
    model: gpt-4.1-mini
    connection:
      apiKey: ${{ OPENAI_API_KEY }}
    defaults:
      timeoutMs: 10000
      retry:
        attempts: 2
        backoffMs: 500

# Policy/persona text is versioned prompt configuration, not hard-coded in services.
prompts:
  - name: support.reply
    version: v1
    template: |
      You draft replies for {{ shop }}, a bike shop.
      Be brief, factual and friendly. If facts are missing, say what is missing.

  - name: support.chatbot.base
    version: v1
    template: |
      You are the starter app support chatbot.
      Keep answers short and use tools when they help.

# 4a. Skills: reusable instructions + tool references. No executable TypeScript here.
skills:
  - name: starter_support
    description: Answer starter support questions and look up sample orders.
    instructions:
      - Prefer verified order data over guesses.
    tools:
      - service: SupportService
        tags: [public]

# 3. Chatbots: human-facing session surfaces with bounded history and optional tools.
chatbots:
  - name: support
    type: conversation
    model: DEFAULT
    prompts:
      - name: support.chatbot.base
        version: v1
    history:
      maxMessages: 20
    http:
      path: /support
    tools:
      - service: SupportService
        tags: [public]
    toolPolicy:
      allowDestructive: false

# 4b. Agents: task/run harnesses with skills, tools, policy and workspace memory.
agents:
  - name: starter_agent
    model: DEFAULT
    displayName: Starter Agent
    description: A small task-oriented agent for the starter app.
    instructions:
      - Work step by step and call tools when useful.
    skills:
      - starter_support
    tools:
      - service: SupportService
        tags: [public]
    policy:
      allowDestructive: false
      maxToolRounds: 3
    workspace:
      docs: agent-workspace
      blobs: agent-artifacts
      namespace: starter/agent
      tools: true
    http:
      path: /agents/starter
      useHttp: api
