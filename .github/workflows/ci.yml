name: Samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [starter, support-desk]
    env:
      # Intelligence and the platform are private packages on GitHub Packages. Either
      # - add a token with read:packages as the repository secret NPM_REPOSITORY_GH_TOKEN, or
      # - grant this repository read access under "Manage Actions access" of @3flows/intelligence and @3flows/platform.
      # Without either, the workflow's own token can't read them, and the tests are skipped with a warning.
      NPM_REPOSITORY_GH_TOKEN: ${{ secrets.NPM_REPOSITORY_GH_TOKEN || github.token }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        id: install
        continue-on-error: true
        run: corepack enable && yarn install --immutable

      - name: Skip without package access
        if: steps.install.outcome == 'failure'
        run: echo "::warning::Could not install @3flows packages (no read:packages access). Tests skipped. See the comment in ci.yml."

      # Offline: every AI is replaced by the scripted provider. No model, no key.
      - name: Test
        if: steps.install.outcome == 'success'
        run: yarn test
